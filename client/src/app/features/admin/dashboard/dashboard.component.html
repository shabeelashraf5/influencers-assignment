<app-navbar></app-navbar>

<div class="mt-16 p-12">
    <p class="text-2xl text-white font-bold">Research Tasks</p>

<div class="w-full text-white p-4 bg-slate-800 border border-slate-700 rounded-lg shadow-sm sm:p-8 dark:bg-gray-800 dark:border-gray-700 mt-5">

    <p class="font-bold text-xl">Specific Influencer</p>
    <p class="text-sm mt-2">Research a known health influencer by name</p>

<div class="mt-5">
<form (click)="addInfluencers()" #messageForm="ngForm">   
    <label for="search" class="mb-2 text-sm font-medium text-gray-900 sr-only dark:text-white">Search</label>
    <div class="relative">
        <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
            <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"/>
            </svg>
        </div>
        <input type="text" [(ngModel)]="name" name="name"  id="search" class="block w-full bg-slate-300 p-4 ps-10 text-sm text-gray-900 border border-slate-700 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Enter Influener Name" required />
        <button type="submit" class="text-white absolute end-2.5 bottom-2.5 bg-slate-900 hover:bg-slate-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-4 py-2 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">Start Research</button>
    </div>
</form>
</div>
</div>


<div *ngFor="let users of userDetails" class="p-5 mb-4 border border-slate-700 rounded-lg bg-slate-800 dark:bg-gray-800 dark:border-gray-700 mt-5">
    <ol class="mt-3 divide-y divide-slate-600 dark:divide-gray-700">
        <li>
            <a class="items-center block p-3 items-center justify-between flex">
                <div [routerLink]="['/page', users._id]" class="text-gray-600 dark:text-gray-400 cursor-pointer">
                    <div><span class="text-2xl font-bold text-gray-100 hover:text-green-500 dark:text-white">{{users.name}}</span></div>
                    <div class="block max-w-3xl bg-transparent rounded-lg shadow-sm mt-2 ">
                        <p class="text-justify text-gray-500 text-xs md:text-sm">{{users.description}}</p>
                    </div>
                </div>
                
                <div>
                    <button (click)="deleteTask(users._id)"  class="block text-white bg-transparent  focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center hover:text-green-500 dark:focus:ring-blue-800" type="button" >
                        <svg class="w-7 h-7 text-gray-200 hover:text-green-500 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18 17.94 6M18 18 6.06 6"/>
                        </svg>
                    </button>
                </div>
            </a>
        </li>
        <li>
            <a class=" block p-3 sm:flex">
                <div class="flex">
                    <div *ngFor="let cat of users.category" class="mt-2 ">
                        <button type="button" class="text-white border border-slate-700 bg-gray-800 hover:bg-green-500 focus:outline-none focus:ring-4 focus:ring-gray-300 font-medium rounded-full text-xs md:text-sm px-5 py-2.5 me-2 mb-2 dark:bg-gray-800 dark:focus:ring-gray-700 dark:border-gray-700">{{cat}}</button>
                    </div>
                </div>
            </a>
        </li>
    </ol>
</div>
